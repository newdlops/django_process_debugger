name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject tracked runtime logs
        shell: bash
        run: |
          if git ls-files --error-unmatch log.txt >/dev/null 2>&1; then
            echo "log.txt must remain untracked; it can contain debugger variable data."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run extension tests
        run: npm test
